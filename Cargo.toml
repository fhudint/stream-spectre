[package]
name = "stream-spectre"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "OBS browser-source stream overlay with chat-driven YouTube mediashare"
license = "AGPL-3.0-only"
publish = false
# Two binaries now (the window one needs a feature), so `cargo run` must be told.
default-run = "stream-spectre"

# The same program in a window of its own (see src/bin/window.rs). Off by
# default: it needs GTK and WebKitGTK on Linux, which a plain build does not.
[features]
window = ["dep:wry", "dep:tao"]

[[bin]]
name = "stream-spectre-window"
path = "src/bin/window.rs"
required-features = ["window"]

# Linux packages (.deb and .rpm), made in CI on a tag; see
# .github/workflows/release.yml and packaging/. Both hold the window program
# (the menu entry "Stream Spectre") and the terminal one.
[package.metadata.deb]
maintainer = "fhudint"
section = "video"
priority = "optional"
depends = "libgtk-3-0 | libgtk-3-0t64, libwebkit2gtk-4.1-0"
extended-description = "An OBS browser-source overlay with a moderated, chat-driven YouTube and TikTok mediashare and a chat overlay. Opens its dashboard in a window of its own."
assets = [
  ["target/release/stream-spectre-window", "usr/bin/", "755"],
  ["target/release/stream-spectre", "usr/bin/", "755"],
  ["packaging/linux/stream-spectre-window.desktop", "usr/share/applications/", "644"],
  ["assets/icon-16.png", "usr/share/icons/hicolor/16x16/apps/stream-spectre.png", "644"],
  ["assets/icon-32.png", "usr/share/icons/hicolor/32x32/apps/stream-spectre.png", "644"],
  ["assets/icon-48.png", "usr/share/icons/hicolor/48x48/apps/stream-spectre.png", "644"],
  ["assets/icon-64.png", "usr/share/icons/hicolor/64x64/apps/stream-spectre.png", "644"],
  ["assets/icon-128.png", "usr/share/icons/hicolor/128x128/apps/stream-spectre.png", "644"],
  ["assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/stream-spectre.png", "644"],
  ["assets/icon-512.png", "usr/share/icons/hicolor/512x512/apps/stream-spectre.png", "644"],
  ["assets/icon.svg", "usr/share/icons/hicolor/scalable/apps/stream-spectre.svg", "644"],
  ["README.md", "usr/share/doc/stream-spectre/README.md", "644"],
  ["LICENSE", "usr/share/doc/stream-spectre/LICENSE", "644"],
]

[package.metadata.generate-rpm]
# The programs are built on Ubuntu; the library names the build would find
# (their versions) are Ubuntu's, so only what is said below is required.
auto-req = "disabled"
assets = [
  { source = "target/release/stream-spectre-window", dest = "/usr/bin/stream-spectre-window", mode = "755" },
  { source = "target/release/stream-spectre", dest = "/usr/bin/stream-spectre", mode = "755" },
  { source = "packaging/linux/stream-spectre-window.desktop", dest = "/usr/share/applications/stream-spectre-window.desktop", mode = "644" },
  { source = "assets/icon-16.png", dest = "/usr/share/icons/hicolor/16x16/apps/stream-spectre.png", mode = "644" },
  { source = "assets/icon-32.png", dest = "/usr/share/icons/hicolor/32x32/apps/stream-spectre.png", mode = "644" },
  { source = "assets/icon-48.png", dest = "/usr/share/icons/hicolor/48x48/apps/stream-spectre.png", mode = "644" },
  { source = "assets/icon-64.png", dest = "/usr/share/icons/hicolor/64x64/apps/stream-spectre.png", mode = "644" },
  { source = "assets/icon-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/stream-spectre.png", mode = "644" },
  { source = "assets/icon-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/stream-spectre.png", mode = "644" },
  { source = "assets/icon-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/stream-spectre.png", mode = "644" },
  { source = "assets/icon.svg", dest = "/usr/share/icons/hicolor/scalable/apps/stream-spectre.svg", mode = "644" },
  { source = "README.md", dest = "/usr/share/doc/stream-spectre/README.md", mode = "644", doc = true },
  { source = "LICENSE", dest = "/usr/share/licenses/stream-spectre/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
gtk3 = "*"
"webkit2gtk4.1" = "*"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
dirs = "7.0.0"
moka = { version = "0.12.16", features = ["future"] }
# Pinned to the exact version whose source was audited (network code, build.rs,
# and the user/chat structs were read in full); bump only after re-auditing.
piratetok-live-rs = "=0.5.0"
reqwest = "0.13.5"
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
tao = { version = "0.37.2", optional = true }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
wry = { version = "0.57.2", optional = true }

[dev-dependencies]
futures-util = "0.3.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "test-util"] }
tokio-tungstenite = "0.30.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Input chat tidak boleh bisa membuat aplikasi panic.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
