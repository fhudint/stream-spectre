[package]
name = "stream-spectre"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "OBS browser-source stream overlay with chat-driven YouTube mediashare"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
moka = { version = "0.12.16", features = ["future"] }
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
regex = "1.13.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Input chat tidak boleh bisa membuat aplikasi panic.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
