[package]
name = "stream-spectre"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "OBS browser-source stream overlay with chat-driven YouTube mediashare"
license = "AGPL-3.0-only"
publish = false
# Two binaries now (the window one needs a feature), so `cargo run` must be told.
default-run = "stream-spectre"

# The same program in a window of its own (see src/bin/window.rs). Off by
# default: it needs GTK and WebKitGTK on Linux, which a plain build does not.
[features]
window = ["dep:wry", "dep:tao"]

[[bin]]
name = "stream-spectre-window"
path = "src/bin/window.rs"
required-features = ["window"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
dirs = "7.0.0"
moka = { version = "0.12.16", features = ["future"] }
# Pinned to the exact version whose source was audited (network code, build.rs,
# and the user/chat structs were read in full); bump only after re-auditing.
piratetok-live-rs = "=0.5.0"
reqwest = "0.13.5"
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
tao = { version = "0.37.2", optional = true }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
wry = { version = "0.57.2", optional = true }

[dev-dependencies]
futures-util = "0.3.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "test-util"] }
tokio-tungstenite = "0.30.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Input chat tidak boleh bisa membuat aplikasi panic.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
