[package]
name = "stream-spectre"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "OBS browser-source stream overlay with chat-driven YouTube mediashare"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Input chat tidak boleh bisa membuat aplikasi panic.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
