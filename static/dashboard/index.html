<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stream Spectre Dashboard</title>
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<section id="login" class="login hidden">
  <form id="login-form" class="card">
    <label for="token-input" data-i18n="dashboard.auth.prompt">Enter the dashboard token</label>
    <div class="row">
      <input id="token-input" type="password" autocomplete="off" spellcheck="false">
      <button type="submit" class="primary" data-i18n="dashboard.auth.submit">Sign in</button>
    </div>
    <p id="login-error" role="alert"></p>
  </form>
</section>

<div id="app" class="shell hidden">
  <aside class="sidebar">
    <div class="brand">
      <svg class="logo" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4.5 21V11a7.5 7.5 0 0 1 15 0v10l-2.5-2-2.5 2-2.5-2-2.5 2-2.5-2z"/>
        <circle cx="9.3" cy="11" r="1.4"/>
        <circle cx="14.7" cy="11" r="1.4"/>
      </svg>
      <span>Stream Spectre</span>
    </div>
    <nav id="side-nav">
      <h2 class="sr-only" data-i18n="dashboard.nav.label"></h2>
      <p class="nav-group" data-i18n="dashboard.nav.group.moderation"></p>
      <a id="nav-overview" class="nav-link" href="#overview">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1"/><rect x="9" y="9" width="4.5" height="4.5" rx="1"/></svg>
        <span data-i18n="dashboard.nav.overview"></span>
      </a>
      <a id="nav-queue" class="nav-link" href="#queue">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h6"/></svg>
        <span data-i18n="dashboard.nav.queue"></span>
        <span id="nav-queue-count" class="badge"></span>
      </a>
      <a id="nav-chat" class="nav-link" href="#chat">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/></svg>
        <span data-i18n="dashboard.nav.chat"></span>
      </a>
      <a id="nav-requests" class="nav-link" href="#requests">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3.2l2 1.3"/></svg>
        <span data-i18n="dashboard.nav.requests"></span>
      </a>
      <a id="nav-blacklist" class="nav-link" href="#blacklist">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M4.2 11.8l7.6-7.6"/></svg>
        <span data-i18n="dashboard.nav.blacklist"></span>
      </a>
      <p class="nav-group" data-i18n="dashboard.nav.group.settings"></p>
      <a id="nav-sources" class="nav-link" href="#sources">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 8a5.5 5.5 0 0 1 11 0M5 8a3 3 0 0 1 6 0"/><circle cx="8" cy="8.5" r="1"/><path d="M8 9.5V13"/></svg>
        <span data-i18n="dashboard.nav.sources"></span>
      </a>
      <a id="nav-rules" class="nav-link" href="#rules">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2.5 5h11M2.5 11h11"/><circle cx="6" cy="5" r="1.5" class="knob"/><circle cx="10.5" cy="11" r="1.5" class="knob"/></svg>
        <span data-i18n="dashboard.nav.rules"></span>
      </a>
      <a id="nav-overlay" class="nav-link" href="#overlay">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="12" height="8" rx="1.5"/><path d="M6 13.5h4"/></svg>
        <span data-i18n="dashboard.nav.overlay"></span>
      </a>
      <a id="nav-settings" class="nav-link" href="#settings">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 2v2M8 12v2M2 8h2M12 8h2M3.8 3.8l1.4 1.4M10.8 10.8l1.4 1.4M3.8 12.2l1.4-1.4M10.8 5.2l1.4-1.4"/></svg>
        <span data-i18n="dashboard.nav.settings"></span>
      </a>
    </nav>
  </aside>

  <div class="content">
    <header class="topbar">
      <div class="brand brand-mobile">
        <svg class="logo" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4.5 21V11a7.5 7.5 0 0 1 15 0v10l-2.5-2-2.5 2-2.5-2-2.5 2-2.5-2z"/>
          <circle cx="9.3" cy="11" r="1.4"/>
          <circle cx="14.7" cy="11" r="1.4"/>
        </svg>
        <span>Stream Spectre</span>
      </div>
      <div id="status" class="statusbar" aria-live="polite">
        <span id="connection" class="pill"></span>
        <span id="chat-status" class="pill"></span>
        <span id="chat-status-youtube" class="pill"></span>
      </div>
      <div class="account-wrap">
        <button id="account-button" type="button" class="channel" aria-expanded="false" aria-controls="account-menu">
          <span id="channel-initial" class="avatar" aria-hidden="true"></span>
          <span id="channel-name"></span>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5.5L7 9l3.5-3.5"/></svg>
        </button>
        <div id="account-menu" class="menu hidden">
          <p id="menu-channel" class="menu-head"></p>
          <a id="menu-settings" href="#account" data-i18n="dashboard.account.menu.settings"></a>
          <button id="menu-disconnect" type="button" class="hidden"></button>
        </div>
      </div>
    </header>

    <p id="error" class="banner banner-error hidden" role="alert"></p>
    <p id="flash" class="banner banner-ok hidden" role="status"></p>
    <p id="update-banner" class="banner banner-ok hidden" role="status">
      <span id="update-text"></span>
      <a id="update-link" class="link" target="_blank" rel="noopener noreferrer" data-i18n="dashboard.update.download"></a>
    </p>

    <main>
      <section id="view-overview" class="view">
        <div class="title-row">
          <h1 id="overview-heading" tabindex="-1" data-i18n="dashboard.nav.overview"></h1>
          <p class="muted" data-i18n="dashboard.overview.hint"></p>
        </div>
        <div class="ov-grid">
          <section class="card ov-stat">
            <h2 data-i18n="dashboard.overview.waiting"></h2>
            <b id="ov-waiting">0</b>
            <a href="#queue" class="link" data-i18n="dashboard.overview.open_queue"></a>
          </section>
          <section class="card ov-stat"><h2 data-i18n="dashboard.overview.received"></h2><b id="ov-received">0</b></section>
          <section class="card ov-stat"><h2 data-i18n="dashboard.overview.approved"></h2><b id="ov-approved">0</b></section>
          <section class="card ov-stat"><h2 data-i18n="dashboard.overview.rejected"></h2><b id="ov-rejected">0</b></section>
          <section class="card ov-stat"><h2 data-i18n="dashboard.overview.rate"></h2><b id="ov-rate">0</b><span class="muted small" data-i18n="dashboard.overview.per_minute"></span></section>
        </div>
        <div class="ov-cols">
          <div class="ov-col">
            <section class="card ov-card">
              <h2 data-i18n="dashboard.nav.sources"></h2>
              <ul id="ov-sources" class="ov-sources"></ul>
              <h3 class="ov-sub" data-i18n="dashboard.overview.chart"></h3>
              <div id="ov-chart" class="spark" role="img"></div>
            </section>
          </div>
          <div class="ov-col">
            <section class="card ov-card">
              <h2 data-i18n="dashboard.now_playing.title"></h2>
              <div id="ov-now"></div>
            </section>
            <section class="card ov-card">
              <div class="card-title">
                <h2 data-i18n="dashboard.rules.title"></h2>
                <a href="#rules" class="link" data-i18n="dashboard.rules.change"></a>
              </div>
              <ul id="ov-rules" class="chips"></ul>
            </section>
          </div>
        </div>
      </section>

      <section id="view-queue" class="view queue-view hidden" data-pane="queue">
        <p id="setup-hint" class="banner banner-warn hidden">
          <span id="setup-hint-text"></span>
          <a href="#sources" class="link" data-i18n="dashboard.nav.sources"></a>
        </p>
        <div class="title-row">
          <h1 id="queue-heading" tabindex="-1" data-i18n="dashboard.queue.heading"></h1>
          <p id="queue-summary" class="muted"></p>
          <button id="rail-toggle" type="button" class="small rail-toggle" aria-pressed="false"></button>
        </div>

        <div class="pane-tabs" role="group">
          <button id="tab-queue" type="button" class="tab" aria-pressed="true">
            <span data-i18n="dashboard.tabs.waiting"></span>
            <span id="tab-queue-count" class="badge"></span>
          </button>
          <button id="tab-notices" type="button" class="tab" aria-pressed="false">
            <span data-i18n="dashboard.notices.title"></span>
          </button>
        </div>

        <div id="queue-grid" class="queue-grid">
          <section class="card onair" aria-labelledby="now-heading">
            <h2 id="now-heading" class="sr-only" data-i18n="dashboard.now_playing.title"></h2>
            <div id="now" class="now"></div>
          </section>

          <section class="card today" aria-labelledby="today-heading">
            <div class="card-title">
              <h2 id="today-heading" data-i18n="dashboard.today.title"></h2>
              <span id="today-since" class="muted small"></span>
            </div>
            <dl class="stats">
              <div><dt data-i18n="dashboard.today.received"></dt><dd id="stat-received">0</dd></div>
              <div><dt data-i18n="dashboard.today.approved"></dt><dd id="stat-approved">0</dd></div>
              <div><dt data-i18n="dashboard.today.rejected"></dt><dd id="stat-rejected">0</dd></div>
              <div><dt data-i18n="dashboard.today.waiting"></dt><dd id="stat-waiting">0</dd></div>
            </dl>
            <p class="dim small" data-i18n="dashboard.today.note"></p>
          </section>

          <section class="card queue-card" aria-labelledby="pending-heading">
            <div class="card-head">
              <div class="card-title">
                <h2 id="pending-heading" data-i18n="dashboard.pending.title"></h2>
                <span id="queue-count" class="badge"></span>
              </div>
              <ul id="keys" class="keys">
                <li><kbd>&uarr;&darr;</kbd><span data-i18n="dashboard.keys.select"></span></li>
                <li><kbd>A</kbd><span data-i18n="dashboard.keys.approve"></span></li>
                <li><kbd>R</kbd><span data-i18n="dashboard.keys.reject"></span></li>
                <li><kbd>S</kbd><span data-i18n="dashboard.keys.skip"></span></li>
                <li><kbd>P</kbd><span data-i18n="dashboard.keys.pause"></span></li>
              </ul>
            </div>
            <ul id="pending" class="rows"></ul>
            <div class="card-head sub">
              <div class="card-title">
                <h2 id="approved-heading" data-i18n="dashboard.approved.title"></h2>
                <span id="approved-count" class="badge"></span>
              </div>
            </div>
            <ul id="approved" class="rows"></ul>
          </section>

          <div class="rail">
            <section class="card rules" aria-labelledby="rules-heading-card">
              <div class="card-title">
                <h2 id="rules-heading-card" data-i18n="dashboard.rules.title"></h2>
                <a href="#rules" class="link" data-i18n="dashboard.rules.change"></a>
              </div>
              <ul id="rules-chips" class="chips"></ul>
            </section>

            <section class="card chat-card" aria-labelledby="notices-heading">
              <div class="card-head">
                <div class="card-title">
                  <h2 id="notices-heading" data-i18n="dashboard.notices.title"></h2>
                </div>
              </div>
              <div class="notices-body">
                <ul id="notices" class="notices" aria-live="polite"></ul>
                <p id="notices-empty" class="hint" data-i18n="dashboard.notices.empty"></p>
              </div>
            </section>
          </div>
        </div>
      </section>

      <section id="view-chat" class="view hidden">
        <div class="title-row">
          <h1 id="chat-heading" tabindex="-1" data-i18n="dashboard.chat.title"></h1>
          <p class="muted" data-i18n="dashboard.chat.hint"></p>
        </div>
        <section class="card chat-page" aria-labelledby="chat-heading">
          <div class="card-head chat-tools">
            <button id="chat-pause" type="button" class="small" aria-pressed="false" data-i18n="dashboard.chat.pause"></button>
            <div id="chat-sources" class="seg" role="group">
              <button id="chat-src-all" type="button" class="small" aria-pressed="true" data-i18n="dashboard.chat.source.all"></button>
              <button id="chat-src-youtube" type="button" class="small" aria-pressed="false" data-i18n="dashboard.chat.source.youtube"></button>
              <button id="chat-src-tiktok" type="button" class="small" aria-pressed="false" data-i18n="dashboard.chat.source.tiktok"></button>
            </div>
            <label class="toggle">
              <input id="chat-commands-only" type="checkbox">
              <span data-i18n="dashboard.chat.commands_only"></span>
            </label>
            <input id="chat-search" type="search" class="chat-search" autocomplete="off" spellcheck="false">
            <span id="chat-rate" class="muted small"></span>
          </div>
          <div class="chat-body">
            <ol id="chat-log" class="chat-log" tabindex="0"></ol>
            <p id="chat-empty" class="hint" data-i18n="dashboard.chat.empty"></p>
            <button id="chat-jump" type="button" class="primary small chat-jump hidden"></button>
          </div>
        </section>
      </section>

      <section id="view-requests" class="view hidden">
        <div class="title-row">
          <h1 id="requests-heading" tabindex="-1" data-i18n="dashboard.requests.title"></h1>
          <p class="muted" data-i18n="dashboard.requests.hint"></p>
        </div>
        <div class="card queue-card">
          <ul id="requests" class="rows"></ul>
        </div>
      </section>

      <section id="view-blacklist" class="view hidden">
        <div class="title-row">
          <h1 id="blacklist-heading" tabindex="-1" data-i18n="dashboard.blacklist.title"></h1>
          <p class="muted" data-i18n="dashboard.blacklist.hint"></p>
        </div>
        <div class="card page-card">
          <form id="blacklist-form" class="form"></form>
        </div>
      </section>

      <section id="view-sources" class="view hidden">
        <div class="title-row">
          <h1 id="sources-heading" tabindex="-1" data-i18n="dashboard.nav.sources"></h1>
          <p class="muted" data-i18n="dashboard.sources.hint"></p>
        </div>
        <div id="account-youtube-chat" class="card page-card">
          <form id="youtube-chat-form" class="form">
            <h2 data-i18n="dashboard.youtube_chat.title"></h2>
            <div class="field">
              <label for="youtube-chat-video" data-i18n="dashboard.youtube_chat.video"></label>
              <input id="youtube-chat-video" type="text" autocomplete="off" spellcheck="false" maxlength="200">
              <p class="muted small" data-i18n="dashboard.youtube_chat.hint"></p>
            </div>
            <div class="actions">
              <button type="submit" class="primary" data-i18n="dashboard.youtube_chat.save"></button>
            </div>
          </form>
          <label class="toggle">
            <input id="youtube-chat-enabled" type="checkbox">
            <span data-i18n="dashboard.youtube_chat.enabled"></span>
          </label>
          <p id="youtube-chat-status" class="muted small"></p>
          <details id="account-youtube" class="adv">
            <summary data-i18n="dashboard.sources.advanced"></summary>
            <p class="muted small" data-i18n="dashboard.sources.key_note"></p>
            <form id="key-form" class="form">
              <h2 data-i18n="dashboard.account.youtube.title"></h2>
              <p id="key-status" class="status-line"></p>
              <p id="key-source" class="muted small"></p>
              <div class="field">
                <label for="youtube-key" data-i18n="dashboard.account.youtube.label"></label>
                <input id="youtube-key" type="password" autocomplete="off" spellcheck="false" maxlength="200">
                <p class="muted small" data-i18n="dashboard.account.youtube.hint"></p>
              </div>
              <p id="key-locked" class="hint-warn hidden" data-i18n="dashboard.account.locked"></p>
              <div class="actions">
                <button id="key-save" type="submit" class="primary" data-i18n="dashboard.account.youtube.save"></button>
                <button id="key-remove" type="button" class="hidden" data-i18n="dashboard.account.youtube.remove"></button>
              </div>
            </form>
          </details>
        </div>
        <div id="account-tiktok" class="card page-card">
          <form id="tiktok-form" class="form">
            <h2 data-i18n="dashboard.tiktok.title"></h2>
            <div class="field">
              <label for="tiktok-username" data-i18n="dashboard.tiktok.username"></label>
              <input id="tiktok-username" type="text" autocomplete="off" spellcheck="false" maxlength="70">
              <p class="muted small" data-i18n="dashboard.tiktok.hint"></p>
            </div>
            <div class="actions">
              <button type="submit" class="primary" data-i18n="dashboard.tiktok.save"></button>
            </div>
          </form>
          <label class="toggle">
            <input id="tiktok-enabled" type="checkbox">
            <span data-i18n="dashboard.tiktok.enabled"></span>
          </label>
          <p id="tiktok-status" class="muted small"></p>
        </div>
      </section>

      <section id="view-rules" class="view hidden">
        <div class="title-row">
          <h1 id="settings-heading" tabindex="-1" data-i18n="dashboard.nav.rules"></h1>
        </div>
        <div id="rules-tabs" class="tabs page-tabs" role="tablist">
          <button id="rtab-general" type="button" class="tab" role="tab" aria-controls="rules-general" data-i18n="dashboard.rules.tab.general"></button>
          <button id="rtab-youtube" type="button" class="tab" role="tab" aria-controls="rules-youtube" data-i18n="dashboard.rules.tab.youtube"></button>
          <button id="rtab-tiktok" type="button" class="tab" role="tab" aria-controls="rules-tiktok" data-i18n="dashboard.rules.tab.tiktok"></button>
        </div>
        <form id="settings-form" class="rules-form">
          <div id="rules-savebar" class="savebar hidden" role="status">
            <span data-i18n="dashboard.rules.unsaved"></span>
            <button id="rules-discard" type="button" data-i18n="dashboard.rules.discard"></button>
            <button id="rules-save" type="submit" class="primary" data-i18n="dashboard.settings.save"></button>
          </div>
        </form>
        <div id="rules-commands" class="card page-card">
          <form id="commands-form" class="form">
            <h2 data-i18n="dashboard.commands.title"></h2>
            <p class="muted small" data-i18n="dashboard.commands.hint"></p>
            <div class="field">
              <label for="commands-prefix" data-i18n="dashboard.commands.prefix"></label>
              <input id="commands-prefix" type="text" class="short" autocomplete="off" spellcheck="false" maxlength="8">
            </div>
            <div id="commands-rows" class="command-rows"></div>
            <p id="commands-example" class="muted small"></p>
            <div class="actions">
              <button id="commands-add" type="button" data-i18n="dashboard.commands.add"></button>
              <button type="submit" class="primary" data-i18n="dashboard.commands.save"></button>
            </div>
          </form>
        </div>
      </section>

      <section id="view-overlay" class="view hidden">
        <div class="title-row">
          <h1 id="overlay-heading" tabindex="-1" data-i18n="dashboard.overlay.title"></h1>
          <p class="muted" data-i18n="dashboard.overlay.hint"></p>
        </div>
        <div id="overlay-tabs" class="tabs page-tabs" role="tablist">
          <button id="otab-mediashare" type="button" class="tab" role="tab" aria-controls="overlay-mediashare" data-i18n="dashboard.overlay.tab.mediashare"></button>
          <button id="otab-chat-panel" type="button" class="tab" role="tab" aria-controls="overlay-chat-panel" data-i18n="dashboard.overlay.tab.chat_panel"></button>
          <button id="otab-chat-float" type="button" class="tab" role="tab" aria-controls="overlay-chat-float" data-i18n="dashboard.overlay.tab.chat_float"></button>
        </div>
        <div id="overlay-mediashare" class="card page-card">
          <h2 data-i18n="dashboard.overlay.mediashare"></h2>
          <p class="muted" data-i18n="dashboard.overlay.mediashare_hint"></p>
          <div class="field">
            <span class="field-label" data-i18n="dashboard.overlay.address"></span>
            <code id="overlay-shown" class="address"></code>
          </div>
          <div class="actions">
            <button id="copy-overlay-page" type="button" class="primary" data-i18n="dashboard.overlay.copy"></button>
          </div>
          <fieldset class="field themes-field">
            <legend class="field-label" data-i18n="dashboard.overlay.theme"></legend>
            <div id="themes" class="themes"></div>
            <p class="muted" data-i18n="dashboard.overlay.theme_hint"></p>
          </fieldset>
          <div class="field">
            <label id="volume-heading" for="volume" data-i18n="dashboard.settings.volume"></label>
            <div class="row">
              <input id="volume" type="range" min="0" max="100" step="1">
              <output id="volume-value" for="volume"></output>
            </div>
          </div>
        </div>
        <div id="overlay-chat-panel" class="card page-card">
          <h2 data-i18n="dashboard.overlay.chat_panel"></h2>
          <p class="muted" data-i18n="dashboard.overlay.chat_panel_hint"></p>
          <div class="field">
            <span class="field-label" data-i18n="dashboard.overlay.address"></span>
            <code id="chat-panel-shown" class="address"></code>
          </div>
          <div class="actions">
            <button id="copy-chat-panel" type="button" class="primary" data-i18n="dashboard.overlay.copy"></button>
          </div>
          <fieldset class="field themes-field">
            <legend class="field-label" data-i18n="dashboard.overlay.theme"></legend>
            <div id="chat-panel-themes" class="themes"></div>
          </fieldset>
        </div>
        <div id="overlay-chat-float" class="card page-card">
          <h2 data-i18n="dashboard.overlay.chat_float"></h2>
          <p class="muted" data-i18n="dashboard.overlay.chat_float_hint"></p>
          <div class="field">
            <span class="field-label" data-i18n="dashboard.overlay.address"></span>
            <code id="chat-float-shown" class="address"></code>
          </div>
          <div class="actions">
            <button id="copy-chat-float" type="button" class="primary" data-i18n="dashboard.overlay.copy"></button>
          </div>
          <fieldset class="field themes-field">
            <legend class="field-label" data-i18n="dashboard.overlay.theme"></legend>
            <div id="chat-float-themes" class="themes"></div>
          </fieldset>
        </div>
      </section>

      <section id="view-settings" class="view hidden">
        <div class="title-row">
          <h1 id="chat-settings-heading" tabindex="-1" data-i18n="dashboard.nav.settings"></h1>
        </div>
        <div class="card page-card">
          <form id="chat-form" class="form">
            <div class="field">
              <label for="chat-history" data-i18n="dashboard.chat.history"></label>
              <input id="chat-history" type="number" min="0" max="200" step="1" inputmode="numeric">
            </div>
            <div class="actions">
              <button type="submit" class="primary" data-i18n="dashboard.chat.history_save"></button>
            </div>
          </form>
        </div>
        <div class="card page-card">
          <div class="form">
            <h2 data-i18n="dashboard.developer_notice.title"></h2>
            <p class="muted" data-i18n="dashboard.developer_notice.hint"></p>
            <label class="toggle">
              <input id="developer-notice" type="checkbox">
              <span data-i18n="dashboard.developer_notice.enabled"></span>
            </label>
          </div>
        </div>
        <div class="card page-card">
          <div class="form">
            <h2 data-i18n="dashboard.update.title"></h2>
            <p id="update-version" class="muted"></p>
            <p id="update-off" class="muted small hidden" data-i18n="dashboard.update.off"></p>
            <div class="actions">
              <button id="update-check" type="button" data-i18n="dashboard.update.check"></button>
            </div>
            <p id="update-status" class="status-line" role="status"></p>
          </div>
        </div>
      </section>
    </main>

    <dialog id="view-account" class="view account-dialog hidden" aria-labelledby="account-heading">
        <div class="dialog-head">
          <div class="title-row">
            <h1 id="account-heading" tabindex="-1" data-i18n="dashboard.account.title"></h1>
            <p class="muted" data-i18n="dashboard.account.hint"></p>
          </div>
          <button id="account-close" type="button" class="icon-button">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
          </button>
        </div>

        <div id="account-tabs" class="tabs" role="tablist">
          <button id="atab-profile" type="button" class="tab" role="tab" aria-controls="account-profile" data-tab="profile" data-i18n="dashboard.account.tab.profile"></button>
          <button id="atab-token" type="button" class="tab" role="tab" aria-controls="account-token" data-tab="token" data-i18n="dashboard.account.tab.token"></button>
        </div>

        <div id="account-profile" class="page-card" data-panel="profile">
          <form id="profile-form" class="form">
            <div class="profile-row">
              <span id="profile-preview" class="avatar avatar-large" aria-hidden="true"></span>
              <div class="profile-photo">
                <label class="button-like" for="profile-photo" data-i18n="dashboard.profile.photo"></label>
                <input id="profile-photo" class="sr-only" type="file" accept="image/jpeg,image/png,image/webp">
                <button id="profile-photo-remove" type="button" class="hidden" data-i18n="dashboard.profile.photo_remove"></button>
              </div>
            </div>
            <div class="field">
              <label for="profile-name" data-i18n="dashboard.profile.name"></label>
              <input id="profile-name" type="text" autocomplete="off" spellcheck="false" maxlength="40">
              <p class="muted small" data-i18n="dashboard.profile.hint"></p>
            </div>
            <div class="actions">
              <button type="submit" class="primary" data-i18n="dashboard.profile.save"></button>
            </div>
          </form>
        </div>

        <div id="account-token" class="page-card" data-panel="token">
          <div class="form">
            <h2 id="token-heading" tabindex="-1" data-i18n="dashboard.account.token.title"></h2>
            <p id="token-status" class="status-line"></p>
            <p class="muted small" data-i18n="dashboard.account.token.hint"></p>
          </div>
        </div>
    </dialog>
  </div>

  <nav id="bottom-nav" class="bottom-nav">
    <h2 class="sr-only" data-i18n="dashboard.nav.label"></h2>
    <a id="bnav-overview" href="#overview">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1"/><rect x="9" y="9" width="4.5" height="4.5" rx="1"/></svg>
      <span data-i18n="dashboard.nav.overview"></span>
    </a>
    <a id="bnav-queue" href="#queue">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h6"/></svg>
      <span data-i18n="dashboard.nav.queue"></span>
    </a>
    <a id="bnav-chat" href="#chat">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/></svg>
      <span data-i18n="dashboard.nav.chat"></span>

    <a id="bnav-requests" href="#requests">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3.2l2 1.3"/></svg>
      <span data-i18n="dashboard.nav.requests"></span>
    </a>
    <a id="bnav-blacklist" href="#blacklist">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M4.2 11.8l7.6-7.6"/></svg>
      <span data-i18n="dashboard.nav.blacklist"></span>
    </a>
    <a id="bnav-sources" href="#sources">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 8a5.5 5.5 0 0 1 11 0M5 8a3 3 0 0 1 6 0"/><circle cx="8" cy="8.5" r="1"/><path d="M8 9.5V13"/></svg>
      <span data-i18n="dashboard.nav.sources"></span>
    </a>
    <a id="bnav-rules" href="#rules">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M2.5 5h11M2.5 11h11"/><circle cx="6" cy="5" r="1.5" class="knob"/><circle cx="10.5" cy="11" r="1.5" class="knob"/></svg>
      <span data-i18n="dashboard.nav.rules"></span>
    </a>
    <a id="bnav-overlay" href="#overlay">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="12" height="8" rx="1.5"/><path d="M6 13.5h4"/></svg>
      <span data-i18n="dashboard.nav.overlay"></span>
    </a>
    <a id="bnav-settings" href="#settings">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 2v2M8 12v2M2 8h2M12 8h2M3.8 3.8l1.4 1.4M10.8 10.8l1.4 1.4M3.8 12.2l1.4-1.4M10.8 5.2l1.4-1.4"/></svg>
      <span data-i18n="dashboard.nav.settings"></span>
    </a>
  </nav>
</div>
