<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stream-spectre overlay</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<main id="root" class="hidden" data-theme="obsidian">
  <div id="card">
    <div id="head"><span id="kicker"></span><span id="left"></span></div>
    <div id="frame">
      <div id="stage">
        <div id="player"></div>
        <div id="tiktok"></div>
        <div id="paused" role="status"><span id="paused-icon" aria-hidden="true"><i></i><i></i></span><span id="paused-label"></span></div>
      </div>
      <div id="bar"><div id="bar-fill"></div></div>
    </div>
    <div id="caption">
      <div id="who">
        <span id="avatar" aria-hidden="true"></span>
        <span id="eq" aria-hidden="true"><i></i><i></i><i></i></span>
        <span id="requested"></span>
        <span id="name"></span>
        <span id="role"></span>
      </div>
      <span id="title"></span>
      <span id="channel"></span>
      <span id="time"></span>
    </div>
  </div>
</main>
<script src="overlay-core.js"></script>
<script src="overlay.js"></script>
</body>
</html>
