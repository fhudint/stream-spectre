# stream-spectre configuration.
#
# Copy this file to `config.toml` (next to the binary) or to the per-user config
# directory (Linux: ~/.config/stream-spectre/config.toml,
# Windows: %APPDATA%\stream-spectre\config.toml,
# macOS: ~/Library/Application Support/stream-spectre/config.toml).
# You can also point to it with `--config <path>` or STREAM_SPECTRE_CONFIG.
#
# This file is only ever read. Settings changed in the dashboard (moderation,
# volume, blacklist, chat history) are saved by the program to
# `config.settings.toml` next to this file, and a table saved there replaces
# the same table here. Delete the table or that file to go back to this one.
#
# Secrets do NOT go here. Set them as environment variables or in a `.env`
# file (see `.env.example`): YOUTUBE_API_KEY, DASHBOARD_TOKEN. A YouTube API key
# entered on the dashboard is saved in `config.secrets.toml` next to this file
# (private to your user, git-ignored) and wins over YOUTUBE_API_KEY.
#
# Every key is optional. The values below are what the program uses when a key
# is left out, except for three that this example sets differently, as a
# starting point: `general.language` ("en"), the chat commands (`!yt` for
# YouTube and `!vt` for TikTok) and the chat settings, which have no useful
# default: leave them out and the program starts anyway, waits, and you enter
# the TikTok username or the YouTube live on the dashboard's Account page.

[general]
# Language of the dashboard and overlay: "id" or "en".
language = "en"
# Look on GitHub for a newer version when the program starts and then once a day,
# and say so in the dashboard. Only the program's name and version are sent (as
# any browser would send its own); nothing is installed by itself. The "Check for
# updates" button on the Settings page works whatever this says.
check_updates = true

[server]
# Address for the dashboard and the OBS overlay. Keep 127.0.0.1 unless you need
# network access; any other address requires the DASHBOARD_TOKEN secret.
bind = "127.0.0.1"
port = 8787

# Chat is read from TikTok and from YouTube at the same time, each one only
# when it has something to read and is not switched off. (An old `source = ...`
# line under [chat] is still accepted and ignored.)

[chat.tiktok]
# Username of the streamer whose LIVE chat is read, with or without "@".
# Can be left empty and set from the dashboard (Account page) instead; a
# change there takes effect at once, without a restart.
# username = "your_tiktok_username"
# Set to false to stop reading TikTok chat without losing the username.
# enabled = true

[chat.youtube]
# The YouTube live whose chat is read: its link or its 11-character video ID.
# Only a public live works. A live gets a new video each time, so this is
# meant to be set from the dashboard (Account page) for each stream. The chat is read without an API
# key, from the page YouTube shows to everyone.
# video = "https://www.youtube.com/watch?v=VIDEO_ID"
# enabled = true

[command]
# Viewers send: <prefix><name> <video ID or link>, for example "@yt dQw4w9WgXcQ"
# for YouTube or "@vt 7700124541145599252" for TikTok (a TikTok video ID, the
# code of a short link such as ZSpGELffb, or a link).
# One prefix (1 to 4 characters, no spaces) is shared by every command. Each
# command is a name (letters, digits and _, at most 32; capitals do not count)
# and the source its links come from: "youtube" or "tiktok". A command takes
# only links and IDs of its own source. TikTok videos always wait for a
# moderator, even in automatic mode. Up to 8 commands, no name twice. Several
# names for one source work like several words for the same thing. Also
# editable on the dashboard's Rules page.
# The default is "@", so a request reads like a mention in the chat; another
# prefix such as "!" works as well.
prefix = "@"
commands = [
  { name = "yt", source = "youtube" },
  { name = "vt", source = "tiktok" },
]
# An older file with `name = "v"` instead of `commands` still works.

[youtube]
# How long video lookups are cached, and how many are kept.
cache_ttl_secs = 21600
cache_max_entries = 1000
request_timeout_secs = 10

[moderation]
# "manual": every request waits for approval in the dashboard.
# "auto": requests that pass validation are approved automatically.
mode = "manual"
# Seconds a user must wait between submissions. 0 turns it off. Each chat can
# have its own (youtube_cooldown_secs, tiktok_cooldown_secs below).
cooldown_secs = 60
# Longest video accepted, in seconds.
max_duration_secs = 600
# Most requests waiting in the queue at once.
max_queue_len = 20
# Initial volume and the highest volume the dashboard may set (0-100).
volume = 50
max_volume = 80
# Live streams and premieres may be requested. YouTube Shorts links may be (the
# check only looks at the form of the link: a Short opened as a watch link
# passes).
allow_live = false
allow_shorts = true
# Only videos of these categories may be requested; empty: all. Any of film,
# autos, music, pets, sports, travel, gaming, people, comedy, entertainment,
# news, howto, education, science, nonprofits.
allowed_categories = []

# --- the YouTube chat ---
# Minimum role: "viewer" (anyone), "member" (of the channel) or "moderator".
youtube_min_role = "viewer"
# A Super Chat sender gets in whatever their role is.
youtube_superchat_bypass = false
# Most requests of this chat that may be waiting or queued at once, so it cannot
# fill the queue. 0 is no limit.
youtube_max_waiting = 0
# Not set: the general cooldown_secs applies.
# youtube_cooldown_secs = 30
# Requests from this role and above are approved at once, even in manual mode.
# Not set: a moderator decides on each.
# youtube_auto_approve = "member"

# --- the TikTok chat ---
# Minimum role: "everyone", "follower", "subscriber" or "moderator".
tiktok_min_role = "follower"
# Minimum gifter level and fan club level. 0 turns the check off.
min_gifter_level = 0
min_fan_club_level = 0
# Most requests of this chat that may be waiting or queued at once. 0 is no limit.
tiktok_max_waiting = 0
# Not set: the general cooldown_secs applies.
# tiktok_cooldown_secs = 30
# (TikTok has no automatic approval: a video from TikTok has had no length, age
# or embedding check, so a person always looks first.)

[blacklist]
# Anything listed here is rejected.
video_ids = []       # YouTube video IDs, e.g. ["dQw4w9WgXcQ"]
channels = []        # YouTube channel names
title_words = []     # words that must not appear in a video title or in a viewer's message
senders = []         # viewers who may not request anything: a name as shown, or an account ID (youtube:UC...)

[dashboard]
# How many recent chat messages the dashboard shows right after it is opened or
# reloaded (0 to 200). Chat is only kept in memory, never written to disk.
chat_history = 20
# The name and the picture next to the avatar in the dashboard (set on the
# Profile tab of the account dialog). Not read from any chat. The picture is a
# small base64 data:image address; the overlay never gets either.
# display_name = ""
# avatar = ""

[overlay.mediashare]
# The look of the mediashare overlay: obsidian, paper, brutal, terminal, candy, pixel,
# comic, outline, receipt or messages. Changeable in the dashboard (Overlay page),
# also while streaming. Adding theme=name to the overlay's address in OBS
# (after a ? or a &) gives that one source another look.
theme = "obsidian"
# The author of this program (an account named in src/chat/developer.rs) can show a
# short notice on this overlay by writing "@dev text" in the chat: 8 seconds, at most
# one every 30. Nobody else can. Set false to never show them (also a switch on the
# Settings page).
developer_notice = true

[overlay.chat_panel]
# The look of the chat overlay with a background (/overlay/chat/panel/): obsidian,
# paper, brutal, terminal, candy, pixel, receipt, messages or ticker (a bar along the
# bottom). Changed the same way.
theme = "obsidian"

[overlay.chat_float]
# The look of the transparent chat overlay (/overlay/chat/float/): outline, comic or
# notes (sticky notes). Changed the same way.
theme = "outline"
